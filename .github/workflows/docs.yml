# SPDX-License-Identifier: Apache-2.0
# Build the Documenter site and deploy it to the gh-pages branch.
name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# deploydocs pushes the built site to the gh-pages branch.
permissions:
  contents: write
  statuses: write

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
